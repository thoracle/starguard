    # --- Starguard prototype (gunicorn on :5079, ~/projects/luster/deploy/) ---
    # The page fetches its score API by relative URL, so it works under the prefix as long as the path ends in a slash.
    location = /starguard { return 301 /starguard/; }
    location = /starguard/api/scores {
        limit_req zone=dev_api burst=20 nodelay;
        client_max_body_size 4k;
        proxy_pass http://127.0.0.1:5079/api/scores;
        include /etc/nginx/snippets/retroverse-dev-proxy.conf;
    }
    location /starguard/ {
        proxy_pass http://127.0.0.1:5079/;
        include /etc/nginx/snippets/retroverse-dev-proxy.conf;
    }

